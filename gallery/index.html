<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PUDDL3 P4RTS</title>
    <script>
      // Arriving at the /library picker (landing "Get Started", refresh, direct
      // link): hold a dark, chrome-free screen from the very first paint until
      // the picker itself is ready, so nothing flashes in between.
      // A <style> element, not a class on <html> — the theme provider assigns
      // document.documentElement.className outright, which erased a class here
      // (and briefly took `dark` with it, flashing the light theme).
      if (/\/library\/?$/.test(location.pathname)) {
        var s = document.createElement('style');
        s.id = 'p4rts-boot';
        s.textContent =
          'html,body{background:#120f17!important}' +
          '.ln-navbar,.sidebar,.category-page{opacity:0!important;pointer-events:none!important}';
        document.head.appendChild(s);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
